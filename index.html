<!DOCTYPE html>
<html lang='en'>


<head>
    <meta charset="utf-8" />

    <link rel="stylesheet" type="text/css" href="styles/main.css">
    <link rel="stylesheet" type="text/css" href="styles/initialValuesList.css">
    <link rel="stylesheet" type="text/css" href="styles/controls.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,300,0,0&icon_names=add,delete_forever" />

    <title>Wavy 1D</title>
</head>


<body>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/webgpu.js"></script>
    <script type="module" src="src/controls.js"></script>
    <script type="module" src="src/initialValuesList.js"></script>

    <div class="banner">Wavy 1D</div>

    <div class="canvas-container">
        <div class="panel">
            <canvas id="mainCanvas"></canvas>

            <div id="sim-controls" class="panel">
                <div id="sim-controls-left">
                    <button id="sim-run-toggle-btn" type="button">Pause</button>

                    <label for="sim-dt-inp">dt:</label>
                    <input id="sim-dt-inp" type="number" step="0.001" min="0" value="0.005">

                    <label for="sim-iterations-inp">Iterations:</label>
                    <input id="sim-iterations-inp" type="number" step="1" min="1" value="4">
                    <button id="sim-step-btn" type="button">Step</button>
                </div>

                <div id="sim-controls-right">
                    <span>Time step per frame: </span><span id="sim-timestep-txt"></span>
                </div>

            </div>
        </div>
    </div>

    <div class="initial-values-configuration-container">
        <div class="panel">
            <h1>Set Initial Values</h1>
            <p>Predefined constants: TWO_PI, PI, HALF_PI</p>

            <div class="panel">
                <div class="panel-label">Create new initial value:</div>
                <div class="initial-value-row">
                    <div class="row-fields">
                        <div class="field-type">
                            <select id="new-type" aria-label="Type">
                                <option value="displacement">displacement</option>
                                <option value="velocity">velocity</option>
                            </select>
                        </div>
                        <div class="field-function">
                            <input type="text" id="new-function" placeholder="x => ... input as JavaScript"
                                aria-label="function field">
                        </div>
                        <div class="field-interval-min">
                            <input type="number" id="new-interval-min" value="-1.0" min="-1" max="1"
                                aria-label="interval min field">
                        </div>
                        <div class="field-interval-max">
                            <input type="number" id="new-interval-max" value="1.0" min="-1" max="1"
                                aria-label="interval max field">
                        </div>
                    </div>
                    <button class="icon-btn" id="add-btn" title="add initial value" aria-label="add initial value">
                        <span class="material-symbols-outlined">add</span>
                    </button>
                </div>
            </div>

            <div class="panel">
                <div class="panel-label">Edit initial values:</div>
                <div id="initial-values-list"></div>
                <div class="empty-hint" id="empty-hint">No inital values — create one above</div>
            </div>

            <button class="set-initial-values-btn" id="set-btn">set initial values</button>
        </div>
    </div>
</body>


</html>
